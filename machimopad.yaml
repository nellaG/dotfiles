# ch57x-keyboard-tool 설정 (3키 + 노브 1개, 1189:8890)
# 키 3개와 노브 프레스는 평소 안 쓰는 F13~F16을 보내고,
# Hammerspoon이 이 키를 받아서 MIDI로 바꿔줍니다.
orientation: normal
rows: 1
columns: 3
knobs: 1
layers:
  - buttons:
      - ["f13", "f14", "f15"]      # → MIDI C1, C2, C3
    knobs:
      - ccw: "shift-wheelup"       # macOS에서 Shift+휠 = 가로 스크롤
        press: "f16"               # → MIDI Play/Stop
        cw: "shift-wheeldown"
 
